    if (QQ.shakeT > 0) QQ.shakeT--;
    for (let i = toasts.length - 1; i >= 0; i--) if (--toasts[i].t <= 0) toasts.splice(i, 1);

  }
  function draw() {
    ctx.save();
    if (QQ.shakeT > 0) ctx.translate(QQ.irnd(-2, 2), QQ.irnd(-2, 2));
    QQ.rect(-4, -4, W + 8, H + 8, '#0b0912');
    if (QQ.scene) QQ.scene.draw();

<script>
// Game state and party rules: stats, levelling, inventory, the trap economy, days and community trust.
(function () {
  'use strict';
  const QQ = window.QQ;

  QQ.newGame = function () {
    const G = QQ.G = {
      v: 1, map: 'ends', x: 14, y: 12, dir: 1,
      party: [], chars: {}, p: 60, inv: { potnoodle: 2, crisps: 1 },
      stash: { bud: 0, light: 0, dark: 0 }, bag: 0,
      day: 1, trust: 60, heat: { ends: 0, grim: 0, dreg: 0, pid: 0, quay: 0 },
      sold: {}, flags: {}, quest: 'start', steps: 0, donated: 0, wins: 0
    };
    QQ.join('kaz', 1); QQ.join('biggz', 1);
    return G;
  };

  QQ.flag = (k, v) => { if (v === undefined) return QQ.G.flags[k]; QQ.G.flags[k] = v; return v; };
  QQ.inParty = (id) => QQ.G.party.includes(id);
  QQ.leadLv = () => QQ.G.chars.kaz.lv;

  // ---------------------------------------------------------------- stats
  QQ.stat = function (id, key) {
    const c = QQ.G.chars[id], d = QQ.CHARS[id];
    let v = Math.floor(d.base[key] + d.grow[key] * (c.lv - 1)) + (c.perm[key] || 0);
    for (const s of ['w', 'g', 'd']) { const it = c.eq[s] && QQ.ITEMS[c.eq[s]]; if (it && it[key]) v += it[key]; }
    return v;
  };
  QQ.maxHp = (id) => QQ.stat(id, 'hp');
  QQ.maxNrg = (id) => QQ.stat(id, 'nrg');
  QQ.xpNext = (lv) => Math.floor(14 * Math.pow(lv, 1.6) + 10);
  QQ.skillsOf = (id) => QQ.CHARS[id].learn.filter(([lv]) => lv <= QQ.G.chars[id].lv).map(([, s]) => s);
  QQ.rankOf = (id, skill) => (QQ.G.chars[id] && QQ.G.chars[id].rank[skill]) || 1;
  QQ.rankMult = (rank) => 1 + 0.22 * (rank - 1);
  QQ.rankCost = (rank) => rank;            // SP to go from rank -> rank+1

  QQ.join = function (id, lv) {
    const d = QQ.CHARS[id];
    QQ.G.chars[id] = { lv: lv || 1, xp: 0, hp: 1, nrg: 1, eq: Object.assign({}, d.eq), sp: Math.max(0, (lv || 1) - 1), rank: {}, perm: {} };
    QQ.G.chars[id].hp = QQ.maxHp(id); QQ.G.chars[id].nrg = QQ.maxNrg(id);
    if (!QQ.G.party.includes(id)) QQ.G.party.push(id);
  };
  // returns list of level-up notes for display
  QQ.gainXp = function (id, n) {
    const c = QQ.G.chars[id], d = QQ.CHARS[id], notes = [];
    c.xp += n;
    while (c.lv < 30 && c.xp >= QQ.xpNext(c.lv)) {
      c.xp -= QQ.xpNext(c.lv);
      const before = { hp: QQ.maxHp(id), atk: QQ.stat(id, 'atk'), def: QQ.stat(id, 'def'), spd: QQ.stat(id, 'spd') };
      c.lv++; c.sp++;

  };

  const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return ((h >>> 0) % 10000) / 10000; };

  QQ.bagCap = () => QQ.BAGS[QQ.G.bag].cap;
  QQ.buyPrice = (prod, delivery) => Math.round(QQ.PRODUCTS[prod].base * (0.85 + 0.3 * QQ.dayRand('buy' + prod)) * (delivery ? 1.25 : 1));
  QQ.sellPrice = (prod, town) => Math.round(QQ.PRODUCTS[prod].base * QQ.TOWNS[town].mult[prod] * (0.9 + 0.25 * QQ.dayRand(town + prod)));

  // what a named customer wants today: {prod, qty, each}
  QQ.customerWant = function (custId, town, prods) {

  };
  QQ.nextDay = function (n) {
    n = n || 1;

    return ok;
  };
  QQ.loadGame = function () {

    QQ.G = s;
    return true;
  };

  QQ.QUESTS = {
    start: 'Find Unc at his flat on Crestwell Estate. He has a job for you.',
    station: 'Catch the train from Crestwell station to Grimsworth.',
    gaz: 'Find 14 Bleak Street in Grimsworth. Unc says a man called Gaz lives there.',
    shed: 'Something is moving in the shed behind Gaz\'s house. Check it.',
    library: 'The Nitty Sage says the trail starts in Grimsworth Library.',
    baz: 'The key page is missing. The bookmark says "Property of B. Bazzington, The Rusty Ferret".',
    dreg: 'The page points to Admiral Kev\'s Fun Palace in Dregthorpe-on-Sea. Catch a train.',
    kev: 'Get into the back office at the Fun Palace and make Admiral Kev talk.',
    pid: 'The ledger says Lady Hedgefund of Piddlebrook Manor bought the amulet. Catch a train.',
    lady: 'Get inside Piddlebrook Manor and find Lady Hedgefund.',
    quay: 'The amulet ships from Blackwater Quay tonight. Get there before Pulon Wrong does.',
    container: 'Find container WR-0N6 at Berth 4, Blackwater Quay.',
    done: 'The ends are safe. For now.'
  };
})();

<script>
// Overworld: map container/builder, movement, NPCs, encounters, HUD.
(function () {
  'use strict';
  const QQ = window.QQ, T = 16;

  class GMap {
    constructor(id, o) {

    fill(x, y, w, h, g, solid) {

        const i = this.i(xx, yy);
        this.g[i] = g; if (solid !== undefined) this.solid[i] = solid ? 1 : 0;

    }
    zoneRect(x, y, w, h, z) {
      for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) if (this.inside(xx, yy)) this.zone[this.i(xx, yy)] = z;
      return this;
    }
    obj(x, y, s, solid, act) {
      if (!this.inside(x, y)) return this;
      const i = this.i(x, y);
      this.o[i] = s; this.solid[i] = solid === false ? 0 : 1;
      if (act) this.acts[i] = act;
      return this;
    }
    objs(s, pts, solid) { pts.forEach(([x, y]) => this.obj(x, y, s, solid)); return this; }
    line(s, x, y, n, dx, dy, solid) { for (let k = 0; k < n; k++) this.obj(x + dx * k, y + dy * k, s, solid); return this; }
    clear(x, y) { const i = this.i(x, y); this.o[i] = null; this.solid[i] = 0; delete this.acts[i]; return this; }
    act(x, y, fn) { this.acts[this.i(x, y)] = fn; return this; }
    step(x, y, fn) { this.steps[this.i(x, y)] = fn; return this; }
    warp(x, y, to) { const i = this.i(x, y); this.warps[i] = to; this.solid[i] = 0; return this; }
    say(x, y, who, text) { return this.act(x, y, () => QQ.say(who, text)); }
    sign(x, y, text) { return this.obj(x, y, 'signpost', true, () => QQ.say({ n: 'Sign' }, text)); }
    // A building: roof rows on top, wall rows (with windows) below, optional door on the bottom row.
    building(x, y, w, h, o) {
      o = o || {};
      const wallRows = o.wallRows || (h >= 4 ? 2 : 1);
      this.fill(x, y, w, h - wallRows, o.roof || 'r_slate', true);
      this.fill(x, y + h - wallRows, w, wallRows, o.wall || 'w_red', true);
      const by = y + h - 1, doorX = o.door === undefined ? -1 : x + o.door;
      for (let yy = y + h - wallRows; yy <= by; yy++) for (let xx = x; xx < x + w; xx++) {
        const i = this.i(xx, yy); this.o[i] = null;
        if (yy === by && xx === doorX) continue;
        if (o.shut) { if ((xx - x) % 2 === 1 || w < 3) this.o[i] = 'shutter'; }
        else if (o.windows !== false && (xx - x) % 2 === 1 && xx !== doorX) this.o[i] = o.lit && (xx + yy) % 3 ? 'window_lit' : 'window';
        if (yy === by && doorX >= 0 && Math.abs(xx - doorX) === 1 && w <= 4) this.o[i] = o.shut ? this.o[i] : null;
      }

        const i = this.i(doorX, by);
        this.o[i] = o.doorSprite || 'door';
        if (o.to) { this.warps[i] = o.to; this.solid[i] = 0; }

    }

    room(wall, floor, exitX, to) {

  }
  QQ.GMap = GMap;

  // ---------------------------------------------------------------- scripts (cutscenes lock player input)
  QQ.script = async function (fn) {

  };

  // ---------------------------------------------------------------- world scene
  const P = { x: 0, y: 0, px: 0, py: 0, dx: 0, dy: 1, moving: 0, flip: false };
  let map = null, pos = [], from = [], banner = 0, encWait = 8, camX = 0, camY = 0;
  const W = QQ.world = {
    P,
    get map() { return map; },
    npc: (id) => map && map.npcs.find((n) => n.id === id),
    visible: (n) => !n.when || n.when(),
    npcAt(x, y) { return map.npcs.find((n) => n.solid && W.visible(n) && n.x === x && n.y === y); },
    setMap(id, x, y, face) {
      map = QQ.MAPS[id];

      P.x = x; P.y = y; P.px = x * T; P.py = y * T; P.moving = 0;
      if (face) { P.dx = face[0]; P.dy = face[1]; }
      pos = [[x, y], [x, y], [x, y], [x, y]]; from = pos.map((p) => p.slice());
      map.npcs.forEach((n) => { n.x = n.hx; n.y = n.hy; n.px = n.x * T; n.py = n.y * T; n.moving = 0; });

      banner = 150; encWait = 8;
      QQ.audio.music(map.music);
      W.centre();
    },
    centre() {
      camX = QQ.clamp(P.px + 8 - QQ.W / 2, 0, Math.max(0, map.w * T - QQ.W));
      camY = QQ.clamp(P.py + 8 - QQ.H / 2, 0, Math.max(0, map.h * T - QQ.H));
      if (map.w * T < QQ.W) camX = -(QQ.W - map.w * T) / 2;
      if (map.h * T < QQ.H) camY = -(QQ.H - map.h * T) / 2;
    },
    async goto(id, x, y, face) {
      QQ.audio.sfx('door');
      await QQ.fade(1, 10);
      W.setMap(id, x, y, face);
      await QQ.fade(0, 10);
    },
    blocked(x, y) { return !map.inside(x, y) || map.solid[map.i(x, y)] || !!W.npcAt(x, y); },
    update() {
      if (QQ.busy) return;
      if (QQ.G.trust <= 0 && !QQ.flag('gameover')) { QQ.script(QQ.story.planningGranted); return; }
      if (P.moving) return;
      if (QQ.input.pressed('b')) { QQ.audio.sfx('ok'); QQ.script(QQ.menus.main); return; }
      if (QQ.input.pressed('a')) { W.interact(); return; }
      let dx = 0, dy = 0;
      if (QQ.input.held('up')) dy = -1; else if (QQ.input.held('down')) dy = 1;
      else if (QQ.input.held('left')) dx = -1; else if (QQ.input.held('right')) dx = 1;
      if (!dx && !dy) return;
      P.dx = dx; P.dy = dy;
      if (dx) P.flip = dx < 0;
      const nx = P.x + dx, ny = P.y + dy;
      if (W.blocked(nx, ny)) {
        // bumping a door-style act (shop doors) triggers it, so shops feel like doors
        const i = map.inside(nx, ny) ? map.i(nx, ny) : -1;
        if (i >= 0 && map.acts[i] && map.o[i] && /door/.test(map.o[i]) && QQ.input.pressed(dy < 0 ? 'up' : dy > 0 ? 'down' : dx < 0 ? 'left' : 'right')) W.interact();
        return;
      }
      from = pos.map((p) => p.slice());
      for (let k = pos.length - 1; k > 0; k--) pos[k] = pos[k - 1].slice();
      pos[0] = [nx, ny];
      P.x = nx; P.y = ny; P.moving = 8;
    },
    interact() {
      const tx = P.x + P.dx, ty = P.y + P.dy;
      if (!map.inside(tx, ty)) return;
      let n = map.npcs.find((q) => W.visible(q) && q.x === tx && q.y === ty);
      // talk across a shop counter
      if (!n && map.o[map.i(tx, ty)] === 'counter') n = map.npcs.find((q) => W.visible(q) && q.x === tx + P.dx && q.y === ty + P.dy);
      if (n && n.talk) {
        n.flip = P.dx > 0 ? true : P.dx < 0 ? false : n.flip;
        QQ.script(async () => {
          if (typeof n.talk === 'function') await n.talk(n);
          else await QQ.say(n.who || { n: n.name, s: n.s }, n.talk);
        });
        return;
      }
      const act = map.acts[map.i(tx, ty)];
      if (act) QQ.script(() => act(tx, ty));
    },
    arrive() {
      QQ.G.x = P.x; QQ.G.y = P.y; QQ.G.steps++;
      const i = map.i(P.x, P.y);
      if (map.warps[i]) {
        const to = map.warps[i];
        QQ.script(async () => {
          const here = map;
          if (to.when && !(await to.when())) { if (map === here) W.shove(); return; }

    },
    // step the player back one tile (used by gated warps / blocked triggers)
    shove() { P.x -= P.dx; P.y -= P.dy; P.px = P.x * T; P.py = P.y * T; pos[0] = [P.x, P.y]; QQ.G.x = P.x; QQ.G.y = P.y; },
    async encounter(z) {
      const town = map.town, heat = town ? QQ.G.heat[town] : 0;
      if (town && heat >= 60 && QQ.stashCount() > 0 && Math.random() < 0.4) { await QQ.story.feds(town); return; }
      const table = QQ.ZONES[z];
      let r = Math.random() * table.reduce((a, t) => a + t[0], 0), group = table[0][1];
      for (const t of table) { r -= t[0]; if (r <= 0) { group = t[1]; break; } }
      const res = await QQ.battle.start(group, { bg: map.bg });

    tick() {

      }
      // NPC idle wandering
      if (!QQ.busy && !QQ.modals.length) for (const n of map.npcs) {
        if (n.moving) {
          n.moving--; n.px = n.x * T - n.mdx * n.moving; n.py = n.y * T - n.mdy * n.moving;
        } else if (n.wander && --n.t <= 0) {
          n.t = QQ.irnd(50, 200);
          const [dx, dy] = QQ.pick([[1, 0], [-1, 0], [0, 1], [0, -1]]), nx = n.x + dx, ny = n.y + dy;
          if (Math.abs(nx - n.hx) <= n.wander && Math.abs(ny - n.hy) <= n.wander && map.inside(nx, ny) && !map.solid[map.i(nx, ny)] &&
              !map.warps[map.i(nx, ny)] && !W.npcAt(nx, ny) && !(nx === P.x && ny === P.y)) {
            n.x = nx; n.y = ny; n.mdx = dx; n.mdy = dy; n.moving = 16; if (dx) n.flip = dx < 0;
          }
        }
      }

    },
    draw() {
      const ctx = QQ.ctx, cx = Math.round(camX), cy = Math.round(camY);
      const x0 = Math.max(0, Math.floor(cx / T)), y0 = Math.max(0, Math.floor(cy / T));
      const x1 = Math.min(map.w - 1, x0 + 21), y1 = Math.min(map.h - 1, y0 + 16);
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const i = map.i(x, y);
        ctx.drawImage(QQ.tiles.get(map.g[i], x, y, QQ.frame), x * T - cx, y * T - cy);
        if (map.o[i]) QQ.spr(map.o[i], x * T - cx, y * T - cy);
      }
      // actors, sorted by y
      const list = [];
      for (const n of map.npcs) if (W.visible(n)) list.push({ y: n.py, x: n.px, s: n.s, flip: n.flip, n });
      const t = P.moving ? 1 - P.moving / 8 : 1;
      for (let k = QQ.G.party.length - 1; k >= 1; k--) {
        if (k >= pos.length) continue;
        const fx = from[k][0] + (pos[k][0] - from[k][0]) * t, fy = from[k][1] + (pos[k][1] - from[k][1]) * t;
        if (!P.moving && pos[k][0] === P.x && pos[k][1] === P.y) continue;
        list.push({ y: fy * T - 0.2 * k, x: fx * T, s: QQ.CHARS[QQ.G.party[k]].sprite, flip: pos[k][0] < from[k][0] || (pos[k][0] === from[k][0] && P.flip), bob: P.moving && ((P.moving + k * 2) >> 2) & 1 });
      }
      list.push({ y: P.py + 0.1, x: P.px, s: QQ.CHARS[QQ.G.party[0]].sprite, flip: P.flip, bob: P.moving && (P.moving >> 2) & 1 });
      list.sort((a, b) => a.y - b.y);
      for (const a of list) {
        const sx = a.x - cx, sy = a.y - cy - 3 - (a.bob ? 1 : 0);
        ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(Math.round(sx) + 3, Math.round(a.y - cy) + 12, 10, 3);
        QQ.spr(a.s, sx, sy, { flip: a.flip });
        if (a.n && a.n.bubble) { const b = a.n.bubble(); if (b) QQ.spr(b, sx, sy - 14 + ((QQ.frame >> 4) & 1)); }
      }
      if (map.night) { ctx.fillStyle = 'rgba(14,18,60,0.36)'; ctx.fillRect(0, 0, QQ.W, QQ.H); }
      W.hud();
    },
    hud() {
      const G = QQ.G, ctx = QQ.ctx;
      ctx.fillStyle = 'rgba(11,9,18,0.82)'; ctx.fillRect(0, 0, QQ.W, 11);
      QQ.text(QQ.money(G.p), 4, 2, 'y');
      QQ.text('TRUST', 62, 2, 'w');
      QQ.bar(92, 2, 44, 7, G.trust / 100, G.trust > 40 ? '#7fd35b' : G.trust > 20 ? '#ffd23f' : '#ff5d5d', '#3a3160');
      if (map.town) {
        QQ.text('HEAT', 144, 2, 'w');
        QQ.bar(170, 2, 34, 7, (G.heat[map.town] || 0) / 100, G.heat[map.town] >= 60 ? '#ff5d5d' : '#ff9d3c', '#3a3160');
      }
      QQ.text('BAG ' + QQ.stashCount() + '/' + QQ.bagCap(), 212, 2, QQ.stashCount() ? 'c' : 'd');
      QQ.text('DAY ' + G.day, QQ.W - 4, 2, 'w', { align: 'right' });
      if (banner > 0) {
        const a = Math.min(1, banner / 20), w = QQ.textW(map.name) + 20;
        ctx.globalAlpha = a; QQ.box((QQ.W - w) / 2, 20, w, 17); QQ.text(map.name, QQ.W / 2, 25, 'y', { align: 'center' }); ctx.globalAlpha = 1;
      }
    },
    // debug / tests: render the whole map to a new canvas
    snapshot(id) {
      const m = QQ.MAPS[id], c = document.createElement('canvas');
      c.width = m.w * T; c.height = m.h * T;
      const x = c.getContext('2d');
      for (let y = 0; y < m.h; y++) for (let xx = 0; xx < m.w; xx++) {
        const i = m.i(xx, y);
        x.drawImage(QQ.tiles.get(m.g[i], xx, y, 0), xx * T, y * T);
        if (m.o[i]) QQ.spr(m.o[i], xx * T, y * T, { ctx: x });
        if (m.zone[i]) { x.fillStyle = 'rgba(255,0,0,0.12)'; x.fillRect(xx * T, y * T, T, T); }
        if (m.warps[i]) { x.strokeStyle = '#0ff'; x.strokeRect(xx * T + 1.5, y * T + 1.5, T - 3, T - 3); }
        if (m.acts[i]) { x.strokeStyle = '#ff0'; x.strokeRect(xx * T + 2.5, y * T + 2.5, T - 5, T - 5); }
      }
      m.npcs.forEach((n) => { QQ.spr(n.s, n.hx * T, n.hy * T - 3, { ctx: x }); x.strokeStyle = '#f0f'; x.strokeRect(n.hx * T + 0.5, n.hy * T + 0.5, T - 1, T - 1); });
      return c;
    }
  };
})();

<script>
// Turn-based party battles.
(function () {
  'use strict';
  const QQ = window.QQ;
  const E_SLOTS = { 1: [[84, 132]], 2: [[104, 118], [64, 142]], 3: [[110, 112], [66, 126], [106, 148]], 4: [[110, 108], [62, 118], [114, 136], [66, 148]] };
  const BOSS_SLOTS = [[70, 142], [128, 114], [132, 148], [26, 112]];
  const P_SLOTS = [[228, 114], [242, 126], [256, 138], [270, 150]];
  let S = null;

  const alive = (side) => S.actors.filter((a) => a.side === side && a.hp > 0);
  const foes = (u) => alive(u.side === 'p' ? 'e' : 'p');
  const mates = (u) => alive(u.side);
  const pause = async (frames) => {
    if (QQ.fast) frames = 1;
    for (let i = 0; i < frames; i++) { if (S.skip && i > 6) break; await QQ.wait(1); }
    S.skip = false;
  };
  const say = async (text, frames) => { S.msg = text; await pause(frames || 46); };
  const float = (a, text, col) => S.floats.push({ x: a.x, y: a.y - 16 * a.scale - 4, text: String(text), col: col || 'w', t: 40 });
  const fx = (a, name) => { if (name) S.fx.push({ name, x: a.x, y: a.y - 8 * a.scale, t: 18 }); };

  function makeParty(id, i) {
    const c = QQ.G.chars[id], d = QQ.CHARS[id];
    return {
      side: 'p', id, name: d.name, sprite: d.sprite, lv: c.lv, hp: c.hp, mhp: QQ.maxHp(id), nrg: c.nrg, mnrg: QQ.maxNrg(id),
      atk: QQ.stat(id, 'atk'), def: QQ.stat(id, 'def'), spd: QQ.stat(id, 'spd'), lck: QQ.stat(id, 'lck'),
      st: {}, x: P_SLOTS[i][0], y: P_SLOTS[i][1], ox: 0, oy: 0, flash: 0, alpha: 1, scale: 2
    };
  }
  function makeEnemies(group) {
    const boss = QQ.ENEMIES[group[0]].boss, slots = boss ? BOSS_SLOTS : E_SLOTS[Math.min(4, group.length)];
    const seen = {}, total = {};
    group.forEach((g) => { total[g] = (total[g] || 0) + 1; });
    return group.slice(0, 4).map((eid, i) => {
      const d = QQ.ENEMIES[eid];
      seen[eid] = (seen[eid] || 0) + 1;
      return Object.assign({}, d, {
        side: 'e', eid, name: d.name + (total[eid] > 1 ? ' ' + 'ABCD'[seen[eid] - 1] : ''), mhp: d.hp, nrg: 0, mnrg: 0,
        st: {}, x: slots[i][0], y: slots[i][1], ox: 0, oy: 0, flash: 0, alpha: 1, scale: d.boss ? 3 : 2
      });
    });
  }

  function damage(u, t, pow) {
    const atk = u.atk * (u.st.atkUp ? 1.3 : 1) * (u.st.atkDown ? 0.72 : 1);
    const def = t.def * (t.st.defUp ? 1.45 : 1) * (t.st.defDown ? 0.65 : 1);
    let d = 1.5 * pow * atk * atk / (atk + def) * QQ.rnd(0.9, 1.1);
    const crit = Math.random() < 0.04 + u.lck * 0.006;
    if (crit) d *= 1.6;
    if (t.guard) d *= 0.5;
    return { n: Math.max(1, Math.round(d)), crit };
  }
  async function hurt(t, n, crit) {
    t.hp = Math.max(0, t.hp - n);
    t.flash = 8; float(t, n, crit ? 'y' : t.side === 'p' ? 'r' : 'w');
    QQ.audio.sfx(crit ? 'crit' : 'hit');
    if (t.side === 'p' || crit) QQ.shakeT = crit ? 8 : 4;
  }
  async function checkDeaths() {
    for (const a of S.actors) {
      if (a.hp <= 0 && !a.dead) {
        a.dead = true; a.st = {}; a.guard = false;
        QQ.audio.sfx('die');
        if (a.side === 'e') { await QQ.tween(a, 'alpha', 0, QQ.fast ? 1 : 16); }
        else await say(a.name + ' is sparked out!', 34);
      }
    }
  }
  function addStatus(t, s, turns, quiet) {
    const had = t.st[s];
    t.st[s] = Math.max(t.st[s] || 0, turns);
    if (!quiet) { const d = QQ.STATUS[s]; float(t, d.tag, d.col); QQ.audio.sfx(d.good ? 'buff' : 'debuff'); }
    return !had;
  }

  // Carry out a skill. targets is an array of actors chosen by the caller.
  async function perform(u, sid, targets) {
    const sk = QQ.SKILLS[sid], mult = u.side === 'p' ? QQ.rankMult(QQ.rankOf(u.id, sid)) : 1;
    if (sk.cost && u.side === 'p') u.nrg -= sk.cost;
    const tname = targets.length === 1 ? targets[0].name : 'everyone';
    const line = sk.msg ? sk.msg.replace('{u}', u.name).replace('{t}', tname)
      : sid === 'attack' ? u.name + ' swings at ' + tname + '.' : u.name + ' uses ' + sk.name + '!';
    S.msg = line;
    const dir = u.side === 'p' ? -1 : 1;
    await QQ.tween(u, 'ox', dir * 14, QQ.fast ? 1 : 6, 'out');
    let dealt = 0;
    if (sk.special === 'bag') await mysteryBag(u, mult);
    else {
      const hits = sk.hits || 1;
      for (let h = 0; h < hits; h++) {
        let list = targets.filter((t) => t.hp > 0 || sk.revive);
        if (sk.tgt === 'rand') { const f = foes(u); if (!f.length) break; list = [QQ.pick(f)]; }
        if (!list.length) break;
        for (const t of list) {
          fx(t, sk.fx);
          if (sk.pow) { const d = damage(u, t, sk.pow * mult); await hurt(t, d.n, d.crit); dealt += d.n; }
          if (sk.revive && t.hp <= 0) { t.hp = Math.round(t.mhp * sk.revive * mult); t.dead = false; float(t, 'UP!', 'g'); QQ.audio.sfx('heal'); }
          else if (sk.heal && t.hp > 0) { const n = Math.round(t.mhp * sk.heal * mult); t.hp = Math.min(t.mhp, t.hp + n); float(t, '+' + n, 'g'); QQ.audio.sfx('heal'); }
          if (sk.cleanse) for (const s in t.st) if (!QQ.STATUS[s].good) delete t.st[s];
        }
        await pause(hits > 1 ? 12 : 16);
      }
      // statuses land after the hits
      for (const [s, turns, chance, onSelf] of sk.st || []) {
        for (const t of onSelf ? [u] : targets) {
          if (t.hp <= 0) continue;
          let c = chance * (onSelf || QQ.STATUS[s].good ? 1 : mult);
          if (s === 'stun' && t.boss) c *= 0.4;
          if (Math.random() < c) addStatus(t, s, turns); else if (!sk.pow) float(t, 'MISS', 'd');
        }
      }
      if (sk.st) await pause(14);
      if (sk.steal && u.side === 'p' && dealt) { const n = Math.round((3 + u.lv * 2.5) * sk.steal * QQ.rnd(0.8, 1.2)); S.loot += n; float(u, '+' + QQ.money(n), 'y'); QQ.audio.sfx('cash'); await pause(14); }
      if (sk.drain && dealt) { const n = Math.round(dealt * 0.5); u.hp = Math.min(u.mhp, u.hp + n); float(u, '+' + n, 'g'); }
      if (sk.special === 'fee' && u.side === 'e') {
        const n = Math.min(QQ.G.p, Math.round(4 + u.lv * 3));
        if (n > 0) { QQ.addP(-n, true); await say('You are down ' + QQ.money(n) + '.', 30); }
      }
      if (sk.special === 'snatch' && u.side === 'e') {
        const food = Object.keys(QQ.G.inv).filter((k) => QQ.ITEMS[k].type === 'use' && QQ.ITEMS[k].heal && !QQ.ITEMS[k].perm);
        if (food.length) { const k = QQ.pick(food); QQ.take(k, 1); await say(u.name + ' nicks your ' + QQ.ITEMS[k].name + '!', 36); }
      }
    }
    await QQ.tween(u, 'ox', 0, QQ.fast ? 1 : 5);
    await checkDeaths();
  }
  async function mysteryBag(u, mult) {
    const r = Math.random(), en = foes(u);
    if (r < 0.36) {
      await say('It is full of half bricks!', 30);
      for (const t of en) { fx(t, 'brickitem'); const d = damage(u, t, 1.35 * mult); await hurt(t, d.n, d.crit); }
    } else if (r < 0.6) {
      await say('Sausage rolls. Loads of them. Everyone eats.', 30);
      for (const t of mates(u)) { const n = Math.round(t.mhp * 0.3 * mult); t.hp = Math.min(t.mhp, t.hp + n); float(t, '+' + n, 'g'); fx(t, 'sausageroll'); }
      QQ.audio.sfx('heal');
    } else if (r < 0.8) {
      await say('A three-week-old egg mayo sandwich.', 30);
      for (const t of en) { fx(t, 'fx_poison'); addStatus(t, 'poison', 3); }
    } else if (r < 0.93) {
      await say('A pigeon flies out. Absolute chaos.', 30);
      for (const t of en) { fx(t, 'pigeon'); if (Math.random() < (t.boss ? 0.3 : 0.6)) addStatus(t, 'stun', 1); }
    } else await say('It is just more carrier bags.', 36);
    await pause(16);
  }
  async function useItem(u, key, t) {
    const it = QQ.ITEMS[key];
    QQ.take(key, 1);
    S.msg = u.name + ' uses ' + it.name + '.';
    fx(t, it.icon);
    if (it.revive && t.hp <= 0) { t.hp = Math.round(t.mhp * it.revive); t.dead = false; float(t, 'UP!', 'g'); }
    if (it.heal && t.hp > 0) { t.hp = Math.min(t.mhp, t.hp + it.heal); float(t, '+' + it.heal, 'g'); }
    if (it.nrg && t.hp > 0) { t.nrg = Math.min(t.mnrg, t.nrg + it.nrg); float(t, '+' + it.nrg + ' NRG', 'c'); }
    if (it.nrgAll) for (const m of mates(u)) { m.nrg = Math.min(m.mnrg, m.nrg + it.nrgAll); float(m, '+' + it.nrgAll + ' NRG', 'c'); }
    if (it.cure) for (const s in t.st) if (!QQ.STATUS[s].good) delete t.st[s];
    for (const [s, turns] of it.st || []) addStatus(t, s, turns, true);
    QQ.audio.sfx('heal');
    await pause(26);
  }

  // ---------------------------------------------------------------- player command selection
  function pickTarget(list, label) {
    list = list.slice().sort((a, b) => a.y - b.y);
    return new Promise((res) => {
      let i = 0;
      const m = QQ.push({
        update() {
          let d = 0;
          if (QQ.input.pressed('up') || QQ.input.pressed('left')) d = -1;
          if (QQ.input.pressed('down') || QQ.input.pressed('right')) d = 1;
          if (d) { i = (i + d + list.length) % list.length; QQ.audio.sfx('move'); }
          if (QQ.input.pressed('a')) { QQ.audio.sfx('ok'); QQ.pop(m); S.cursorOn = null; res(list[i]); }
          else if (QQ.input.pressed('b')) { QQ.audio.sfx('cancel'); QQ.pop(m); S.cursorOn = null; res(null); }
          else S.cursorOn = list[i];
        },
        draw() {
          const t = list[i];
          QQ.box(4, 160, 124, 30, { title: label });
          QQ.text(t.name, 12, 168, 'y');
          QQ.text('HP ' + t.hp + '/' + t.mhp, 12, 178, 'w');
        }
      });
      S.cursorOn = list[0];
    });
  }
  async function targetsFor(u, sk) {
    const pool = { enemy: () => foes(u), ally: () => mates(u), dead: () => S.actors.filter((a) => a.side === u.side && a.hp <= 0) }[sk.tgt];
    if (sk.tgt === 'enemies' || sk.tgt === 'rand') return foes(u);
    if (sk.tgt === 'allies') return mates(u);
    if (sk.tgt === 'self') return [u];
    const list = pool();
    if (!list.length) return null;
    const t = await pickTarget(list, sk.name);
    return t ? [t] : null;
  }
  async function command(u) {
    S.active = u;
    for (;;) {
      const c = await QQ.menu({
        x: 4, y: 160, w: 124, cancel: false, sel: S.lastCmd[u.id] || 0, title: u.name,
        items: [{ label: 'Attack' }, { label: 'Skills' }, { label: 'Items' }, { label: 'Guard' }, { label: 'Leg It', disabled: S.noFlee }]
      });
      S.lastCmd[u.id] = c;
      if (c === 0) { const t = await targetsFor(u, QQ.SKILLS.attack); if (t) return { skill: 'attack', targets: t }; }
      else if (c === 1) {
        const ids = QQ.skillsOf(u.id);
        const s = await QQ.menu({
          x: 4, y: 160, w: 156, rows: 5, title: 'Skills', desc: { x: 4, y: 124, w: 312, h: 34 }, sel: S.lastSkill[u.id] || 0,
          items: ids.map((id) => { const k = QQ.SKILLS[id], r = QQ.rankOf(u.id, id); return { label: k.name + (r > 1 ? ' ' + '+'.repeat(r - 1) : ''), right: k.cost, rcolor: 'c', disabled: u.nrg < k.cost, desc: k.desc }; })
        });
        if (s >= 0) { S.lastSkill[u.id] = s; const t = await targetsFor(u, QQ.SKILLS[ids[s]]); if (t) return { skill: ids[s], targets: t }; }
      } else if (c === 2) {
        const keys = Object.keys(QQ.G.inv).filter((k) => QQ.ITEMS[k].type === 'use' && !QQ.ITEMS[k].fieldOnly);
        const s = await QQ.menu({
          x: 4, y: 160, w: 156, rows: 5, title: 'Items', desc: { x: 4, y: 124, w: 312, h: 34 }, empty: 'No snacks. Peak.',
          items: keys.map((k) => ({ label: QQ.ITEMS[k].name, right: 'x' + QQ.G.inv[k], desc: QQ.ITEMS[k].desc }))
        });
        if (s >= 0) {
          const it = QQ.ITEMS[keys[s]];
          const list = it.revive ? S.actors.filter((a) => a.side === 'p' && a.hp <= 0) : it.nrgAll ? null : mates(u);
          if (list && !list.length) { QQ.audio.sfx('no'); continue; }
          const t = list ? await pickTarget(list, it.name) : u;
          if (t) return { item: keys[s], targets: [t] };
        }
      } else if (c === 3) return { guard: true };
      else if (c === 4) return { flee: true };
    }
  }
  function aiPick(u) {
    const opts = u.acts.filter(([sid]) => {
      const k = QQ.SKILLS[sid];
      if (k.heal && !mates(u).some((m) => m.hp < m.mhp * 0.7)) return false;
      if (k.st && !k.pow && k.st.every(([s, , , self]) => (self || QQ.STATUS[s].good ? mates(u) : foes(u)).every((t) => t.st[s]))) return false;
      return true;
    });
    const list = opts.length ? opts : [['attack', 1]];
    let r = Math.random() * list.reduce((a, o) => a + o[1], 0), sid = list[0][0];
    for (const o of list) { r -= o[1]; if (r <= 0) { sid = o[0]; break; } }
    const k = QQ.SKILLS[sid];
    let targets;
    if (k.tgt === 'enemies' || k.tgt === 'rand') targets = foes(u);
    else if (k.tgt === 'allies') targets = mates(u);
    else if (k.tgt === 'self') targets = [u];
    else if (k.tgt === 'ally') targets = [mates(u).slice().sort((a, b) => a.hp / a.mhp - b.hp / b.mhp)[0]];
    else { const f = foes(u), bait = f.filter((t) => t.st.taunt); targets = [bait.length && Math.random() < 0.85 ? bait[0] : QQ.pick(f)]; }
    return { skill: sid, targets };
  }

  // ---------------------------------------------------------------- main loop
  async function run(group, o) {
    await say(o.intro || (S.enemies.length > 1 ? S.enemies[0].name.replace(/ [A-D]$/, '') + ' and co. pull up!' : S.enemies[0].name + ' pulls up!'), 50);
    for (;;) {
      const order = S.actors.filter((a) => a.hp > 0).map((a) => ({ a, k: a.spd * (a.st.spdUp ? 1.5 : 1) * QQ.rnd(0.85, 1.15) })).sort((x, y) => y.k - x.k).map((x) => x.a);
      S.actors.forEach((a) => { if (a.turns > 1 && a.hp > 0) order.push(a); });
      for (const u of order) {
        if (u.hp <= 0) continue;
        if (!alive('e').length || !alive('p').length) break;
        u.guard = false;
        if (u.st.stun) { delete u.st.stun; S.active = u.side === 'p' ? u : null; await say(u.name + ' is rattled and cannot move!', 34); continue; }
        let act;
        if (u.side === 'p') { S.msg = ''; act = QQ.autoBattle ? QQ.autoBattle(u, S, { foes, mates }) : await command(u); }
        else { S.active = null; act = aiPick(u); }
        if (act.guard) { u.guard = true; float(u, 'GUARD', 'c'); await say(u.name + ' braces.', 26); }
        else if (act.flee) {
          const ps = alive('p').reduce((a, m) => a + m.spd, 0) / alive('p').length, es = alive('e').reduce((a, m) => a + m.spd, 0) / alive('e').length;
          if (Math.random() < QQ.clamp(0.55 + (ps - es) * 0.03, 0.3, 0.92)) { await say('You leg it!', 34); return 'flee'; }
          await say('Could not get away!', 34);
        } else if (act.item) await useItem(u, act.item, act.targets[0]);
        else await perform(u, act.skill, act.targets);
        if (!alive('e').length) return 'win';
        if (!alive('p').length) return 'lose';
      }
      // end of round: sickness and status timers
      for (const a of S.actors) {
        if (a.hp <= 0) continue;
        if (a.st.poison) { const n = Math.max(1, Math.round(a.mhp * (a.boss ? 0.04 : 0.08))); a.hp = Math.max(0, a.hp - n); float(a, n, 'p'); a.flash = 6; }
        for (const s in a.st) if (s !== 'stun' && --a.st[s] <= 0) delete a.st[s];
      }
      await checkDeaths();
      if (!alive('e').length) return 'win';
      if (!alive('p').length) return 'lose';
    }
  }
  async function victory() {
    S.active = null;
    QQ.audio.music(null); QQ.audio.sfx('win');
    const xp = S.enemies.reduce((a, e) => a + e.xp, 0), p = S.enemies.reduce((a, e) => a + e.p, 0) + S.loot;
    await say('Big W. ' + xp + ' XP and ' + QQ.money(p) + '.', 70);
    QQ.addP(p, true);
    // write party state back, then hand out XP
    S.party.forEach((a) => { const c = QQ.G.chars[a.id]; c.hp = Math.max(1, a.hp); c.nrg = a.nrg; });
    for (const a of S.party) {
      for (const n of QQ.gainXp(a.id, xp)) {
        QQ.audio.sfx('levelup');
        a.hp = QQ.G.chars[a.id].hp; a.mhp = QQ.maxHp(a.id); a.nrg = QQ.G.chars[a.id].nrg; a.mnrg = QQ.maxNrg(a.id); a.dead = false;
        float(a, 'LV ' + n.lv, 'y');
        await say(a.name + ' hits Lv ' + n.lv + '!  HP+' + n.hp + ' ATK+' + n.atk + ' DEF+' + n.def + ' SPD+' + n.spd, 80);
        for (const s of n.learned) await say(a.name + ' learns ' + s + '!', 70);
      }
    }
    for (const e of S.enemies) {
      if (Math.random() < (e.boss ? 1 : 0.16)) {
        const k = e.lv <= 3 ? QQ.pick(['crisps', 'potnoodle']) : e.lv <= 7 ? QQ.pick(['sausageroll', 'chips', 'energy']) : e.lv <= 11 ? QQ.pick(['pie', 'scone', 'coffee']) : QQ.pick(['kebab', 'coffee', 'medkit']);
        QQ.give(k, 1, true); await say('They dropped a ' + QQ.ITEMS[k].name + '.', 50);
      }
    }
    QQ.G.wins++;
  }

  const B = QQ.battle = {
    get state() { return S; },
    async start(group, o) {
      o = o || {};
      const prev = QQ.scene, prevSong = QQ.audio.wanted;
      QQ.audio.sfx('encounter');
      await QQ.flash(8); await QQ.fade(1, 10);
      const party = QQ.G.party.map(makeParty), enemies = makeEnemies(group);
      party.forEach((a) => { if (a.hp <= 0) a.dead = true; });
      S = { actors: party.concat(enemies), party, enemies, bg: o.bg || 'ends', msg: '', floats: [], fx: [], loot: 0, noFlee: !!o.noFlee || enemies.some((e) => e.boss), lastCmd: {}, lastSkill: {}, active: null, skip: false };
      QQ.scene = B;
      QQ.audio.music(o.music || (enemies.some((e) => e.boss) ? 'boss' : 'battle'));
      await QQ.fade(0, 10);
      let res = 'lose';
      try { res = await run(group, o); } catch (e) { console.error('battle error', e); QQ.lastError = String(e && e.stack || e); res = 'win'; }
      if (res === 'win') await victory();
      else {
        S.party.forEach((a) => { const c = QQ.G.chars[a.id]; c.hp = Math.max(res === 'lose' ? 0 : 1, a.hp); c.nrg = a.nrg; });
        if (res === 'lose') { QQ.audio.music(null); QQ.audio.sfx('lose'); await say('The mandem got folded...', 90); }
      }
      await QQ.fade(1, 12);
      QQ.scene = prev; S = null;
      QQ.audio.music(prevSong);
      await QQ.fade(0, 12);
      return res;
    },
    update() { if (S && QQ.input.pressed('a')) S.skip = true; },
    tick() {
      if (!S) return;
      for (const a of S.actors) if (a.flash > 0) a.flash--;
      for (let i = S.floats.length - 1; i >= 0; i--) { const f = S.floats[i]; f.t--; f.y -= 0.5; if (f.t <= 0) S.floats.splice(i, 1); }
      for (let i = S.fx.length - 1; i >= 0; i--) if (--S.fx[i].t <= 0) S.fx.splice(i, 1);
    },
    draw() {
      if (!S) return;
      const ctx = QQ.ctx;
      ctx.drawImage(QQ.tiles.battleBg(S.bg), 0, 0);
      QQ.rect(0, 156, QQ.W, QQ.H - 156, '#0b0912');
      const list = S.actors.slice().sort((a, b) => a.y - b.y);
      for (const a of list) {
        if (a.alpha <= 0.01) continue;
        const w = 16 * a.scale, x = a.x - w / 2 + a.ox, y = a.y - w + a.oy;
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(Math.round(a.x - w / 2 + 3 + a.ox), a.y - 3, w - 6, 5);
        if (a.side === 'p' && a.hp <= 0) {   // sparked out: lying flat
          ctx.save(); ctx.translate(Math.round(x), a.y - 6); ctx.scale(1, 0.4); QQ.spr(a.sprite, 0, 0, { scale: a.scale, flip: true, alpha: 0.7 }); ctx.restore();
          continue;
        }
        const bob = S.active === a ? ((QQ.frame >> 3) & 1) : 0;
        QQ.spr(a.sprite, x, y - bob, { scale: a.scale, flip: a.side === 'p', alpha: a.alpha, white: a.flash > 0 && (a.flash & 2) });
        if (a.guard) QQ.spr('ic_shield', x + (a.side === 'p' ? -10 : w - 6), y + w - 18);
        if (a.side === 'e' && a.hp > 0) {
          QQ.bar(a.x - 14, y - 6, 28, 4, a.hp / a.mhp, a.hp > a.mhp * 0.3 ? '#7fd35b' : '#ff5d5d');
          let tx = a.x - 14;
          for (const s in a.st) { const d = QQ.STATUS[s]; QQ.text(d.tag, tx, y - 15, d.col, { shadow: 1 }); tx += QQ.textW(d.tag) + 3; }
        }
        if (S.active === a) QQ.cursor(Math.round(a.x - 2), Math.round(y - 12));
        if (S.cursorOn === a) QQ.spr('ic_hand', a.side === 'e' ? x + w - 2 : x - 16, y + w / 2 - 8 + ((QQ.frame >> 3) & 1), { flip: a.side === 'e' });
      }
      for (const f of S.fx) QQ.spr(f.name, f.x - 16, f.y - 16 - (18 - f.t) * 0.4, { scale: 2, alpha: Math.min(1, f.t / 6) });
      for (const f of S.floats) QQ.text(f.text, f.x, f.y, f.col, { align: 'center', shadow: 1 });
      // party panel
      QQ.box(130, 160, 186, 78);
      S.party.forEach((a, i) => {
        const y = 166 + i * 17, on = S.active === a;
        QQ.text(a.name, 138, y, a.hp <= 0 ? 'r' : on ? 'y' : 'w');
        QQ.text(a.hp + '/' + a.mhp, 228, y, a.hp <= a.mhp * 0.3 ? 'r' : 'w', { align: 'right' });
        QQ.bar(176, y + 9, 52, 3, a.hp / a.mhp, a.hp > a.mhp * 0.3 ? '#7fd35b' : '#ff5d5d', '#3a3160');
        QQ.text(a.nrg + '/' + a.mnrg, 270, y, 'c', { align: 'right' });
        QQ.bar(236, y + 9, 34, 3, a.mnrg ? a.nrg / a.mnrg : 0, '#6fd3f2', '#3a3160');
        let tx = 276;
        for (const s in a.st) { if (tx > 300) break; const d = QQ.STATUS[s]; QQ.text(d.tag.slice(0, 1) + d.tag.slice(-1), tx, y, d.col); tx += 13; }
      });
      if (!QQ.modals.length) {
        QQ.box(4, 160, 124, 78);
        alive('e').slice(0, 5).forEach((e, i) => QQ.text(e.name, 12, 168 + i * 12, 'w'));
      }
      if (S.msg) { QQ.box(4, 4, 312, 19); QQ.text(S.msg, 12, 10, 'w'); }
    }
  };
})();

        }
      });
    });
  }
  async function itemsMenu() {
    let sel = 0;
    for (;;) {
      const keys = Object.keys(QQ.G.inv).sort((a, b) => 'usewgdkey'.indexOf(QQ.ITEMS[a].type) - 'usewgdkey'.indexOf(QQ.ITEMS[b].type));
      const i = await QQ.menu({
        x: 4, y: 16, w: 180, rows: 9, lh: 17, title: 'Items', sel, desc: DESC, empty: 'Pockets are empty.',
        items: keys.map((k) => ({ label: QQ.ITEMS[k].name, icon: QQ.ITEMS[k].icon, right: QQ.ITEMS[k].type === 'key' ? '' : 'x' + QQ.G.inv[k], color: QQ.ITEMS[k].type === 'key' ? 'y' : 'w', desc: QQ.ITEMS[k].desc }))
      });

      sel = i;
      const it = QQ.ITEMS[keys[i]];
      if (it.type !== 'use') { QQ.audio.sfx('no'); QQ.toast(it.type === 'key' ? 'Hold on to that.' : 'Equip it from the Garms menu.'); continue; }
      const id = await who('Use on');

  const bonus = (it) => ['atk', 'def', 'spd', 'lck', 'hp', 'nrg'].filter((k) => it[k]).map((k) => k.toUpperCase() + ' +' + it[k]).join('  ');
  async function equipMenu() {
    for (;;) {
      const id = await who('Garms');
      if (!id) return;
      let slotSel = 0;
      for (;;) {
        const c = QQ.G.chars[id];
        const s = await QQ.menu({
          x: 4, y: 16, w: 200, lh: 17, title: QQ.CHARS[id].name, sel: slotSel,
          items: ['w', 'g', 'd'].map((k) => ({ label: QQ.SLOT[k] + ': ' + (c.eq[k] ? QQ.ITEMS[c.eq[k]].name : '-'), icon: c.eq[k] ? QQ.ITEMS[c.eq[k]].icon : 'ic_hand' })),
          desc: DESC
        });
        if (s < 0) break;
        slotSel = s;
        const slot = ['w', 'g', 'd'][s];
        const opts = Object.keys(QQ.G.inv).filter((k) => QQ.ITEMS[k].type === slot);

        if (pick < 0) continue;
        QQ.equip(id, slot, pick < opts.length ? opts[pick] : null);
        QQ.audio.sfx('buff');
      }

  }
  async function skillsMenu() {
    for (;;) {
      const id = await who('Skills');
      if (!id) return;
      let sel = 0;
      for (;;) {
        const c = QQ.G.chars[id], ids = QQ.skillsOf(id);
        const i = await QQ.menu({
          x: 4, y: 16, w: 230, rows: 9, title: QQ.CHARS[id].name + '  -  ' + c.sp + ' SP', sel, desc: DESC,
          items: ids.map((sid) => {
            const k = QQ.SKILLS[sid], r = QQ.rankOf(id, sid);
            return { label: k.name, right: 'Rank ' + r + (r < 3 ? '  (' + QQ.rankCost(r) + ' SP)' : '  MAX'), rcolor: r < 3 && c.sp >= QQ.rankCost(r) ? 'g' : 'd', desc: k.desc + '  NRG ' + k.cost + '.  Each rank: +22% power.' };

      'Buy product off Unc in the Ends (or phone a re-up from the trap house). Sell it to cats out in the towns: every town pays best for something different.',
      '^yCommunity trust^w is all that stops Pulon Wrong flattening the Ends. It drops every day, drops if you sell or scrap on your own estate, and rises when you donate at the community centre or beat his people. If it hits zero, it is over.',
      '^oHeat^w rises as you sell in a town. Too hot and the Feds show up. It cools off each day.'

  QQ.menus = {

    async buyProduct(delivery) {
      let sel = 0;

          x: 4, y: 16, w: 210, lh: 17, title: 'Sell in bulk', sel, desc: DESC,

        sel = i;

    // ------------------------------------------------------------ trains
    async travel(here) {
      const ids = Object.keys(QQ.TOWNS).filter((t) => t !== here && (!QQ.TOWNS[t].flag || QQ.flag(QQ.TOWNS[t].flag)) && (t !== 'grim' || QQ.G.quest !== 'start'));
      if (!ids.length) { await QQ.say({ n: 'Ticket Machine' }, 'No services available. Speak to Unc first.'); return false; }
      const i = await QQ.menu({
